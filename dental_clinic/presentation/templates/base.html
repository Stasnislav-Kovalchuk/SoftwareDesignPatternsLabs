<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Dental Clinic MVC" }}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #0b1220; color: #e5e7eb; }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .card { background: #111a2e; border: 1px solid #24304a; border-radius: 14px; padding: 18px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .btn { display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid #2d3b5a; background: #17223b; color: #e5e7eb; cursor: pointer; }
    .btn.primary { background: #2563eb; border-color: #2563eb; }
    .btn.danger { background: #b91c1c; border-color: #b91c1c; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #24304a; text-align: left; }
    th { color: #cbd5e1; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2d3b5a; background: #0b1220; color: #e5e7eb; }
    label { display:block; margin: 12px 0 6px; color: #cbd5e1; }
    .muted { color: #94a3b8; font-size: 14px; }
    .error { background: #2b1220; border: 1px solid #7f1d1d; padding: 12px; border-radius: 12px; }
    header { border-bottom: 1px solid #24304a; background: #0b1220; position: sticky; top: 0; }
    header .container { padding-top: 14px; padding-bottom: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="container row">
      <strong>Dental Clinic MVC</strong>
      <span class="muted">Лабораторна 3 (MVC): Model → View → Controller</span>
      <div class="spacer"></div>
      <a class="btn" href="/docs">Swagger</a>
      <a class="btn" href="/ui/patients">Пацієнти</a>
    </div>
  </header>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
